name: CI

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install tox
        run: python -m pip install tox

      - name: Check formatting
        run: tox -e format-check

      - name: Lint
        run: tox -e lint

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        tox-environment:
          - py310
          - py312
          - py314
        include:
          - tox-environment: py310
            python-version: "3.10"
          - tox-environment: py312
            python-version: "3.12"
          - tox-environment: py314
            python-version: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tox
        run: python -m pip install tox

      - name: Run tests
        run: tox -e ${{ matrix.tox-environment }}

  distributed-tests:
    name: Distributed tests (Gloo, Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tox
        run: python -m pip install tox

      - name: Run multi-process tests
        run: tox -e py312 -- tests/analysis/test_distributed_statistics.py

  type-check:
    name: Type check (optional)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install tox
        run: python -m pip install tox

      - name: Check types
        run: tox -e type-check
