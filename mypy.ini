[mypy]
python_version = 3.10
pretty = True
show_error_codes = True
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True
implicit_optional = True

# The type-check environment intentionally does not install flowTorch's large
# runtime dependency stack. Ignore imports for those external packages while
# continuing to check flowTorch's own annotations and implementation.
[mypy-torch.*,numpy.*,sklearn.*,scipy.*,h5py.*,vtk.*,paraview.*,netCDF4.*,pandas.*,plotly.*]
ignore_missing_imports = True
