[tox]
envlist = py310, py312, py314
skip_missing_interpreters = true

[testenv]
usedevelop = true
extras = all
deps =
    pytest
commands =
    pytest {posargs:-m "not integration"}
passenv =
    FLOWTORCH_DATASETS

[testenv:format]
description = Format Python code with Black
skip_install = true
deps =
    black==26.5.1
commands =
    black --line-length 88 {posargs:flowtorch tests}

[testenv:format-check]
description = Check Python code formatting with Black
skip_install = true
deps =
    black==26.5.1
commands =
    black --check --diff --line-length 88 {posargs:flowtorch tests}

[testenv:lint]
description = Lint Python code with Ruff
skip_install = true
deps =
    ruff==0.15.22
commands =
    ruff check {posargs:flowtorch tests}

[testenv:type-check]
description = Check Python types with mypy
skip_install = true
deps =
    mypy==2.3.0
commands =
    mypy {posargs:flowtorch}

[testenv:docs]
description = Build the Sphinx documentation
deps =
    sphinx
    sphinx-rtd-theme
    nbsphinx
    pypandoc-binary
    recommonmark
setenv =
    PATH = {envsitepackagesdir}/pypandoc/files:{env:PATH}
commands =
    sphinx-build -W --keep-going -b html docs/source docs/build/html

[testenv:package]
description = Build and validate the source and wheel distributions
skip_install = true
deps =
    build
    twine
commands =
    python -m build
    twine check dist/*
