[tox]
envlist = py310, py312, py314
isolated_build = false
skip_missing_interpreters = true

[testenv]
usedevelop = true
deps =
    pytest
commands =
    pytest {posargs:-m "not integration"}
passenv =
    FLOWTORCH_DATASETS

[testenv:format]
description = Format Python code with Black
skip_install = true
deps =
    black==26.5.1
commands =
    black --line-length 88 {posargs:flowtorch tests setup.py}

[testenv:format-check]
description = Check Python code formatting with Black
skip_install = true
deps =
    black==26.5.1
commands =
    black --check --diff --line-length 88 {posargs:flowtorch tests setup.py}
